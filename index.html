<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Keep this site out of search engines and AI crawlers -->
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">

  <title>Track Tester</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #9ec9ef;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    /* No zooming on phones: double-tapping or pinching anywhere (the HUD,
       buttons, panels) used to zoom the page in, sometimes for good.
       Panels can still scroll; the game's own controls set their own rules. */
    html, body, body * {
      touch-action: pan-x pan-y;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    /* The 3D scene fills the whole screen */
    #game {
      position: fixed;
      inset: 0;
      touch-action: none; /* stops the page scrolling while you drag on a phone */
    }
    /* Small label in the corner */
    #info {
      position: fixed;
      left: 12px;
      top: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
    }
    #info b { font-size: 15px; }
    /* Error box: only appears if something goes wrong */
    #errors {
      display: none;
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      max-height: 40vh;
      overflow: auto;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(120, 10, 10, 0.92);
      color: #fff;
      font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      z-index: 10;
    }
  </style>

  <!-- Phones: block double-tap and pinch zoom (iPhones ignore the
       "no zooming" setting above), and if the page ever does end up zoomed
       in, snap it straight back out -->
  <script>
    (function () {
      var stop = function (e) { e.preventDefault(); };
      // iPhone pinch gestures
      document.addEventListener('gesturestart', stop, { passive: false });
      document.addEventListener('gesturechange', stop, { passive: false });
      document.addEventListener('gestureend', stop, { passive: false });
      // two fingers moving = a pinch (the game's own two-finger controls
      // still get the touches; only the browser's zoom is cancelled)
      document.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1 || (e.scale !== undefined && e.scale !== 1)) e.preventDefault();
      }, { passive: false });
      // double-tap zoom
      document.addEventListener('dblclick', stop, { passive: false });
      var lastEnd = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        // a second quick tap on something that isn't a button or text box:
        // cancel it, so the browser doesn't treat it as "zoom in here"
        var t = e.target, tag = t && t.tagName;
        var control = t && t.closest && t.closest('button, a, input, select, textarea, label, [data-tap]');
        if (now - lastEnd < 350 && !control && e.cancelable) e.preventDefault();
        lastEnd = now;
      }, { passive: false });
      // Zoomed in anyway? Re-apply the viewport setting, which makes the
      // browser zoom back out to normal
      var meta = document.querySelector('meta[name=viewport]');
      var base = meta.getAttribute('content');
      function unzoom() {
        if (!window.visualViewport || window.visualViewport.scale <= 1.01) return;
        meta.setAttribute('content', base.replace('maximum-scale=1.0', 'maximum-scale=1.01'));
        setTimeout(function () { meta.setAttribute('content', base); }, 30);
      }
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', unzoom);
        window.visualViewport.addEventListener('scroll', unzoom);
      }
      window.addEventListener('orientationchange', function () { setTimeout(unzoom, 300); });
    })();
  </script>

  <!-- Shows problems on screen, so you don't need the browser's developer tools -->
  <script>
    (function () {
      var shown = {};
      function report(message) {
        if (shown[message]) return;          // don't repeat the same error every frame
        shown[message] = true;
        var box = document.getElementById('errors');
        if (!box) return;
        box.style.display = 'block';
        box.textContent += (box.textContent ? '\n\n' : '') + message;
      }
      window.addEventListener('error', function (e) {
        var where = e.filename ? ' (' + e.filename.split('/').pop() + ' line ' + e.lineno + ')' : '';
        report('Error: ' + e.message + where);
      });
      window.addEventListener('unhandledrejection', function (e) {
        report('Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });

      // If the game hasn't started after a few seconds, check which files are missing
      var FILES = ['rendering.js', 'physics.js', 'input.js', 'sound.js', 'smoke.js', 'hud.js', 'oil.js', 'skids.js', 'debris.js', 'touch.js', 'scenery.js', 'grass.js', 'sky.js', 'updates.js', 'godrays.js', 'rain.js', 'effects.js', 'cockpit.js', 'tyres.js', 'sepang.js'];
      window.checkGameStarted = function () {
        var info = document.getElementById('info');
        if (!info || info.textContent.indexOf('Rendering test') === -1) return;   // it started
        Promise.all(FILES.map(function (f) {
          return fetch(f, { cache: 'no-store' }).then(function (r) { return r.ok ? null : f; })
            .catch(function () { return f; });
        })).then(function (missing) {
          missing = missing.filter(Boolean);
          report(missing.length
            ? 'The game could not start. These files are missing from the repo (check the exact name, all lowercase): ' + missing.join(', ')
            : 'The game could not start, but all files are there. One of them may have a pasting mistake; the error above (if any) says which.');
        });
      };
      window.addEventListener('load', function () { setTimeout(window.checkGameStarted, 4000); });
    })();
  </script>

  <!-- Tells the browser where to download the Three.js 3D library from -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="info">
    <b>Track Tester</b><br>
    Rendering test<br>
    Drag to look around · scroll or pinch to zoom
  </div>
  <div id="errors" role="alert"></div>

  <!-- Loads the game code -->
  <script type="module" src="rendering.js"></script>
</body>
</html>
